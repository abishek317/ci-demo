name: Continuous Integration

# Defines the events that trigger the execution of this workflow
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  build-and-test:
    # Specifies the type of runner (virtual machine) the job runs on
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up a specific version of Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Automatically caches node_modules for faster subsequent runs

      # Step 3: Install all project dependencies safely
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run your automated application tests
      - name: Run Test Suite
        run: npm test
