name: Zero-Prerequisite Diagnostic

# Triggers the workflow manually or whenever code is pushed to any branch
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  system-diagnostic:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Print basic greeting and trigger information
      - name: Welcome and Metadata Check
        run: |
          echo "Workflow triggered successfully!"
          echo "Triggered by event: ${{ github.event_name }}"
          echo "Triggered by user: ${{ github.actor }}"
          echo "Current branch: ${{ github.ref_name }}"

      # Step 2: Check environmental variables and default tooling
      - name: System Environment Info
        run: |
          echo "Host Operating System Info:"
          uname -a
          
          echo "Pre-installed Tool Versions:"
          echo "Python version: $(python3 --version)"
          echo "Git version: $(git --version)"
          echo "Docker version: $(docker --version)"
          echo "Curl version: $(curl --version)"

      # Step 3: Demonstrate dynamic calculations inside the runner
      - name: Simple Computational Task
        run: |
          echo "Generating data on the fly..."
          UPTIME_DATA=$(uptime)
          echo "Current runner uptime: $UPTIME_DATA"
          
          # Math calculation using expr
          RESULT=$(expr 543 + 457)
          echo "Math test verification (543 + 457): $RESULT"
